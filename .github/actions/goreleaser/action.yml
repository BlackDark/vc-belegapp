name: GoReleaser
description: >-
  Install Cosign and Syft outside the checkout, require a clean tree, then
  run GoReleaser. release.yml and the CI dry run both call this so the
  install steps cannot drift.

inputs:
  args:
    description: Arguments for the goreleaser release invocation.
    required: true
  token:
    description: >-
      Token passed as GITHUB_TOKEN. Snapshot runs skip publish, so the API
      is not called.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    # binfmt before the builder. Snapshot --load of linux/arm64, and the
    # real multi-arch buildx build, both need it registered first.
    - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    # $HOME/.cosign, then GITHUB_PATH. Default of this pin is cosign v3.0.6.
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.0.6
    # Tool cache, not the workspace. A curl into $GITHUB_WORKSPACE leaves
    # checksums.txt behind and GoReleaser aborts with "git is in a dirty state".
    - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        syft-version: v1.54.1
    - name: Tools on PATH
      shell: bash
      run: |
        set -euo pipefail
        command -v cosign >/dev/null
        command -v syft >/dev/null
        cosign version
        syft version
    - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser
        version: v2.18.2
        args: check
    # --snapshot implies --skip=validate, so the dry run will not notice a
    # dirty tree. The real release still checks; this assertion covers both.
    - name: Checkout is clean
      shell: bash
      run: |
        set -euo pipefail
        status="$(git status --porcelain)"
        if [ -n "$status" ]; then
          echo "::error::checkout is dirty before GoReleaser"
          printf '%s\n' "$status"
          exit 1
        fi
    - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        distribution: goreleaser
        version: v2.18.2
        args: ${{ inputs.args }}
      env:
        GITHUB_TOKEN: ${{ inputs.token }}

name: Web build
description: >-
  Build web/dist. web/embed.go embeds the bundle with //go:embed, so every job
  that compiles the web package needs the directory to exist before Go runs.
  web/dist is not committed; this action is the single place that produces it.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    - name: Install
      shell: bash
      run: pnpm -C web install --frozen-lockfile
    - name: Build
      shell: bash
      run: pnpm -C web build

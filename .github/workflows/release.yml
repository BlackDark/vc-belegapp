name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a v* tag
        run: |
          ref="${GITHUB_REF}"
          case "$ref" in
            refs/tags/v*) ;;
            *)
              echo "::error::release.yml must run on a v* tag (got ${ref}). Start it with: gh workflow run release.yml --ref vX.Y.Z"
              exit 1
              ;;
          esac

  ci:
    name: ci
    needs: tag
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-binaries
          path: ${{ runner.temp }}/belegapp-binaries
      - name: Image context
        run: |
          mkdir -p "$RUNNER_TEMP/image/linux/amd64"
          cp "$RUNNER_TEMP/belegapp-binaries/linux/amd64/belegapp" "$RUNNER_TEMP/image/linux/amd64/belegapp"
          chmod +x "$RUNNER_TEMP/image/linux/amd64/belegapp"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: ${{ github.workspace }}/Dockerfile.goreleaser
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: vc-belegapp:smoke
          cache-from: type=gha,scope=belegapp
          cache-to: type=gha,scope=belegapp,mode=max
      - name: Smoke
        run: ./scripts/container-smoke.sh vc-belegapp:smoke
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        run: |
          version=1.54.1
          file="syft_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$file" "https://github.com/anchore/syft/releases/download/v${version}/${file}"
          curl -fsSL -o checksums.txt "https://github.com/anchore/syft/releases/download/v${version}/syft_${version}_checksums.txt"
          grep "$file" checksums.txt | sha256sum -c -
          tar -xzf "$file" syft
          sudo mv syft /usr/local/bin/syft
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Image reference in release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          ref="ghcr.io/blackdark/vc-belegapp:${version}"
          body=$(gh release view "$tag" --json body --jq .body)
          if printf '%s\n' "$body" | grep -Fq "$ref"; then
            echo "image reference already present"
            exit 0
          fi
          {
            printf '%s\n' "$body"
            printf '\nContainer image: `%s`\n' "$ref"
          } > /tmp/release-notes.md
          gh release edit "$tag" --notes-file /tmp/release-notes.md
      - name: Image digest
        id: image
        run: |
          digest=$(jq -r '[.[] | select(.type == "Docker Image") | .extra.Digest] | map(select(. != null and . != "")) | unique | .[0] // empty' dist/artifacts.json)
          if [ -z "$digest" ]; then
            echo "Docker image digest missing from dist/artifacts.json" >&2
            jq '.[].type' dist/artifacts.json >&2 || true
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/blackdark/vc-belegapp
          subject-digest: ${{ steps.image.outputs.digest }}

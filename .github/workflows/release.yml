name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a v* tag
        run: |
          ref="${GITHUB_REF}"
          case "$ref" in
            refs/tags/v*) ;;
            *)
              echo "::error::release.yml must run on a v* tag (got ${ref}). Start it with: gh workflow run release.yml --ref vX.Y.Z"
              exit 1
              ;;
          esac

  ci:
    name: ci
    needs: tag
    # A job that calls a reusable workflow cannot set timeout-minutes.
    # Each job in ci.yml has its own limit.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ci.yml
    with:
      # The release job below runs the same GoReleaser action for real.
      # Skip the snapshot dry run so a tag does not build twice.
      dry-run: false

  release:
    name: release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # upload assets and append the release-please notes
      packages: write # push ghcr.io/blackdark/vc-belegapp
      id-token: write # cosign keyless OIDC
      attestations: write # actions/attest-build-provenance
      actions: write # smoke image GHA cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Credentials land in ~/.docker/config.json, not the checkout.
      # github.actor is the GHCR username GitHub documents for GITHUB_TOKEN.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-linux-amd64
          path: ${{ runner.temp }}/image/linux/amd64
      - name: Image context
        run: chmod +x "$RUNNER_TEMP/image/linux/amd64/belegapp"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: ${{ github.workspace }}/Dockerfile.goreleaser
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: vc-belegapp:smoke
          cache-from: type=gha,scope=belegapp
          cache-to: type=gha,scope=belegapp,mode=max
      - name: Smoke
        run: ./scripts/container-smoke.sh vc-belegapp:smoke
      # Tool install, clean-tree check, and GoReleaser. Shared with CI.
      - uses: ./.github/actions/goreleaser
        with:
          args: release --clean
          token: ${{ secrets.GITHUB_TOKEN }}
      # GoReleaser's footer usually already added this line (release.mode: append).
      # Notes are written under /tmp, not the checkout.
      - name: Image reference in release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          ref="ghcr.io/blackdark/vc-belegapp:${version}"
          body=$(gh release view "$tag" --json body --jq .body)
          if printf '%s\n' "$body" | grep -Fq "$ref"; then
            echo "image reference already present"
            exit 0
          fi
          {
            printf '%s\n' "$body"
            printf '\nContainer image: %s\n' "\`$ref\`"
          } > /tmp/release-notes.md
          gh release edit "$tag" --notes-file /tmp/release-notes.md
      - name: Image digest
        id: image
        run: |
          set -euo pipefail
          digest=$(jq -r '
            [ .[] | select(.type == "Docker Image") | .extra.Digest ]
            | map(select(. != null and . != ""))
            | unique
            | if length == 1 then .[0] else empty end
          ' dist/artifacts.json | tr -d '[:space:]')
          case "$digest" in
            sha256:*) ;;
            *)
              echo "Docker image digest missing or not unique in dist/artifacts.json" >&2
              jq '[.[] | select(.type == "Docker Image") | {name, digest: .extra.Digest}]' dist/artifacts.json >&2 || true
              exit 1
              ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/blackdark/vc-belegapp
          subject-digest: ${{ steps.image.outputs.digest }}

name: CI

on:
  # Push to every branch, not pull_request. release-please opens its PR
  # with GITHUB_TOKEN. GitHub creates those pull_request runs and holds
  # them for approval. If nobody approves them, the run finishes as a
  # failure with zero jobs. The annotation is "This workflow run required
  # approval but was not approved before it expired." A push from that
  # token does not create a run, so this workflow does not start for that push.
  # release-please.yml dispatches this workflow on that branch, and the
  # PR lists those checks. A push to a branch with an open PR reports its
  # checks on the PR. Tag pushes are not included, so a v* tag does not
  # start this file directly. release.yml calls it.
  push:
    branches:
      - "**"
  workflow_call:
    inputs:
      dry-run:
        description: Run the GoReleaser snapshot dry run
        type: boolean
        default: true
        required: false
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run the GoReleaser snapshot dry run
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded branch pushes cancel. main and workflow_dispatch do not.
  # The release-branch dispatch must be allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

# web/dist is not committed. web/embed.go embeds it with //go:embed, so every
# job that compiles the web package (the two binary builds, go, vuln, CodeQL)
# runs the shared web-build action first; the web job additionally lints and
# tests the sources. Each GoReleaser target is cross-compiled on its own runner
# (CGO_ENABLED=0, no QEMU) so e2e can start from linux/amd64 without waiting for
# the other arches. docker only copies the linux binaries into distroless.

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/web-build
      - run: pnpm -C web exec biome ci .
      - run: pnpm -C web exec tsc --noEmit
      - run: pnpm -C web exec vitest run

  # One arch per runner. Sharing a runner splits the cores, so four
  # parallel compiles finish no sooner than the slowest one and e2e waits.
  linux-amd64:
    name: linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/web-build
      - uses: ./.github/actions/go-setup
        with:
          scope: linux-amd64
      - run: ./scripts/build-binaries.sh linux/amd64
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belegapp-linux-amd64
          path: dist/linux/amd64/belegapp
          if-no-files-found: error

  linux-arm64:
    name: linux-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/web-build
      - uses: ./.github/actions/go-setup
        with:
          scope: linux-arm64
      - run: ./scripts/build-binaries.sh linux/arm64
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belegapp-linux-arm64
          path: dist/linux/arm64/belegapp
          if-no-files-found: error

  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/web-build
      - uses: ./.github/actions/go-setup
        with:
          scope: go
      - name: Markdown links
        run: go test -count=1 ./internal/doccheck/
      - run: go mod verify
      - run: go generate ./internal/db
      # Generated code is committed. web/dist is a build artifact and ignored,
      # so this diff is only about what the generators above write.
      - run: git diff --exit-code
      - run: go tool sqlc vet
      - run: ./scripts/sqlc-diff.sh
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
      - run: test -z "$(gofmt -l .)"
      # Two steps, not one: the race detector is skipped for internal/db and
      # internal/storage only, and every other package still runs with it.
      #
      # Why the exception: internal/db measures 1.0 s without -race and 21 s
      # with it, and that gap is the four EXPLAIN QUERY PLAN tests in
      # internal/db/plan_test.go, which seed 10k-23k rows each; every
      # instrumented write into a seeded row is what the detector pays for,
      # not the assertion. internal/storage is a much smaller effect here
      # (3.2 s against 4.1 s) and is excluded on the same reasoning rather
      # than on its own numbers: internal/db and internal/storage are the two
      # single-writer packages. One SQLite write pool and one local blob
      # store, no shared mutable state between goroutines, so there is no
      # interleaving for the detector to find in either. Re-measure before
      # changing this back rather than assuming.
      #
      # This is not a weaker test run. Both steps execute the complete test
      # suite of every package they name, with -count=1 so nothing is served
      # from the cache. go list ./... is filtered, not hand-written, so a new
      # package lands in the -race step by default.
      #
      # The two coverage profiles stay separate because -race implies
      # -covermode=atomic and the non-race run writes set-mode counters;
      # coverprofile lines from the two modes cannot go into one file.
      - name: Tests (race detector)
        run: go test -race -count=1 -coverprofile=coverage.out $(go list ./... | grep -v -e /internal/db -e /internal/storage)
      - name: Tests (single-writer SQLite and storage, no race detector)
        run: go test -count=1 -coverprofile=coverage-norace.out ./internal/db/... ./internal/storage/...

  # govulncheck walks the whole module and is the slowest single step.
  # Its own job runs it beside the tests instead of after them.
  vuln:
    name: vuln
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/web-build
      - uses: ./.github/actions/go-setup
        with:
          scope: vuln
      - run: go tool govulncheck ./...

  pdf:
    name: pdf
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-setup
        with:
          scope: pdf
      # Both tools are pinned by checksum in scripts/, so the cache key can
      # only change when a pin changes.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.local/bin/typst
            ~/verapdf
          key: pdf-tools-${{ hashFiles('scripts/install-typst.sh', 'scripts/install-verapdf.sh', 'scripts/verapdf-auto-install.xml') }}
      - name: Install Poppler and Java
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils openjdk-21-jre-headless unzip
      - name: Install Typst
        run: |
          if [ ! -x "$HOME/.local/bin/typst" ]; then ./scripts/install-typst.sh "$HOME/.local/bin"; fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install veraPDF
        run: |
          if [ ! -x "$HOME/verapdf/verapdf" ]; then ./scripts/install-verapdf.sh "$HOME/verapdf"; fi
          echo "$HOME/verapdf" >> "$GITHUB_PATH"
      - name: Golden PDF
        run: go test -count=1 -timeout 15m ./internal/pdf/ ./internal/export/
        env:
          BELEGAPP_REQUIRE_PDF: "1"
          BELEGAPP_PDF_OUT: ${{ github.workspace }}/pdf-out
      - name: Validate PDF/A-2b
        run: |
          verapdf --flavour 2b --format xml -r pdf-out > pdf-out/verapdf.xml
          if grep -q 'isCompliant="false"' pdf-out/verapdf.xml; then
            echo "PDF/A-2b validation failed" >&2
            exit 1
          fi
          if ! grep -q 'isCompliant="true"' pdf-out/verapdf.xml; then
            echo "veraPDF report has no compliant result" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verapdf-report
          path: pdf-out/verapdf.xml
          if-no-files-found: warn

  docker:
    name: docker
    needs: [linux-amd64, linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-linux-amd64
          path: ${{ runner.temp }}/image/linux/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-linux-arm64
          path: ${{ runner.temp }}/image/linux/arm64
      - name: Image context
        run: |
          chmod +x "$RUNNER_TEMP/image"/linux/*/belegapp
          test -s "$RUNNER_TEMP/image/linux/amd64/belegapp"
          test -s "$RUNNER_TEMP/image/linux/arm64/belegapp"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: ${{ github.workspace }}/Dockerfile.goreleaser
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          tags: vc-belegapp:ci
          cache-from: type=gha,scope=belegapp
          cache-to: type=gha,scope=belegapp,mode=max
          # The container builder writes this exporter as a tar even without a
          # .tar suffix. Trivy only accepts a Docker archive or an OCI layout
          # directory, so the next step unpacks index.json before the scan.
          outputs: type=oci,dest=/tmp/belegapp-oci.tar
      - name: Unpack OCI layout
        run: |
          mkdir -p /tmp/belegapp-layout
          tar -xf /tmp/belegapp-oci.tar -C /tmp/belegapp-layout
          if [ ! -f /tmp/belegapp-layout/index.json ]; then
            echo "OCI layout is missing index.json" >&2
            find /tmp/belegapp-layout -maxdepth 3 -type f | head -50 >&2
            exit 1
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/belegapp-layout
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
      - name: Load linux/amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: ${{ github.workspace }}/Dockerfile.goreleaser
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: vc-belegapp:ci
          cache-from: type=gha,scope=belegapp
      - name: Smoke
        run: ./scripts/container-smoke.sh vc-belegapp:ci

  e2e:
    name: e2e
    needs: linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-setup
        with:
          scope: e2e
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-linux-amd64
          path: dist/linux/amd64
      # Typst is pinned by checksum in scripts/, so the key changes only when
      # the pin does — the same reasoning as the pdf job's tool cache.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.local/bin/typst
          key: typst-${{ runner.os }}-${{ hashFiles('scripts/install-typst.sh') }}
      # Playwright keeps every version it has installed in one directory and
      # downloads only the one the lockfile names, so an entry from an older
      # lockfile still saves the download; the run then saves a fresh key.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Typst
        run: |
          if [ ! -x "$HOME/.local/bin/typst" ]; then ./scripts/install-typst.sh "$HOME/.local/bin"; fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test doubles
        run: |
          chmod +x dist/linux/amd64/belegapp
          CGO_ENABLED=0 go build -trimpath -o bin/fakellm ./e2e/fakellm
          CGO_ENABLED=0 go build -trimpath -o bin/mockoidc ./e2e/mockoidc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: e2e
        env:
          CI: "true"
          BELEGAPP_BIN: ${{ github.workspace }}/dist/linux/amd64/belegapp
          FAKE_LLM_BIN: ${{ github.workspace }}/bin/fakellm
          FAKE_OIDC_BIN: ${{ github.workspace }}/bin/mockoidc
          E2E_PASSWORD: belegapp-e2e
        run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: error

  # GoReleaser compiles the same two binaries the linux-amd64 and linux-arm64
  # jobs compile and builds the same image the docker job builds, from the same
  # sources with the same flags: that part is a duplicate, about 260 s a push.
  # What the snapshot adds on top is GoReleaser's own work — the before-hooks
  # and the dockers_v2 build — and that only reads the files the filter below
  # names.
  changes:
    name: changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff is against github.event.before, the head this push
          # replaced, which the default one-commit checkout does not have.
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # A dispatch has no pushed range, and a branch's first push has an
          # all-zero before. Run the snapshot in both cases.
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "release=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -qE '^(\.goreleaser\.ya?ml|Dockerfile(\.goreleaser)?|LICENSE|README\.md|deploy/.+|\.github/actions/goreleaser/.+|\.github/workflows/(ci|release|release-please)\.yml|scripts/install-typst\.sh)$'; then
            echo "release=true" >>"$GITHUB_OUTPUT"
          else
            echo "release=false" >>"$GITHUB_OUTPUT"
          fi

  # Same tool install and GoReleaser invocation as the tag release, minus
  # publish/sign/announce. --snapshot already implies those skips and also
  # skips validate, so the action asserts a clean tree itself. Snapshot
  # still builds per-platform images locally (--load); it does not push.
  # release.yml calls this workflow with dry-run: false.
  #
  # --skip=archive is what the release needs too, and it is the only way:
  # GoReleaser replaces a missing or empty `archives` list with one default
  # archive, so leaving the key out would publish two tar.gz files.
  release-dry-run:
    name: release-dry-run
    needs: changes
    # workflow_call is the tag release, which passes dry-run false. A
    # pull_request cannot start this workflow from the current file; the case
    # stays in the condition so a run started from the previous one does not
    # lose the snapshot.
    if: |
      !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.dry-run) ||
        (github.event_name == 'push' && needs.changes.outputs.release == 'true') ||
        github.event_name == 'pull_request'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/goreleaser
        with:
          args: release --snapshot --clean --skip=archive,publish,sign,announce
          token: ${{ secrets.GITHUB_TOKEN }}

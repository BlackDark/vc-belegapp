name: CI

on:
  # Push to every branch, not pull_request. release-please opens its PR
  # with GITHUB_TOKEN. GitHub creates those pull_request runs and holds
  # them for approval. If nobody approves them, the run finishes as a
  # failure with zero jobs. The annotation is "This workflow run required
  # approval but was not approved before it expired." A push from that
  # token does not create a run, so this workflow does not start for that push.
  # release-please.yml dispatches this workflow on that branch, and the
  # PR lists those checks. A push to a branch with an open PR reports its
  # checks on the PR. Tag pushes are not included, so a v* tag does not
  # start this file directly. release.yml calls it.
  push:
    branches:
      - "**"
  workflow_call:
    inputs:
      dry-run:
        description: Run the GoReleaser snapshot dry run
        type: boolean
        default: true
        required: false
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run the GoReleaser snapshot dry run
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded branch pushes cancel. main and workflow_dispatch do not.
  # The release-branch dispatch must be allowed to finish.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}

# web builds the bundle once. Each GoReleaser target is cross-compiled on
# its own runner (CGO_ENABLED=0, no QEMU) so e2e can start from linux/amd64
# without waiting for the other arches. docker only copies the linux
# binaries into distroless.

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec vite build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error

  # One arch per runner. Sharing a runner splits the cores, so four
  # parallel compiles finish no sooner than the slowest one and e2e waits.
  linux-amd64:
    name: linux-amd64
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: ./scripts/place-web-dist.sh
      - run: ./scripts/build-binaries.sh linux/amd64
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belegapp-linux-amd64
          path: dist/linux/amd64/belegapp
          if-no-files-found: error

  linux-arm64:
    name: linux-arm64
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: ./scripts/place-web-dist.sh
      - run: ./scripts/build-binaries.sh linux/arm64
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belegapp-linux-arm64
          path: dist/linux/arm64/belegapp
          if-no-files-found: error

  darwin:
    name: darwin
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: ./scripts/place-web-dist.sh
      - run: ./scripts/build-binaries.sh darwin/amd64 darwin/arm64
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belegapp-darwin
          path: dist/darwin/
          if-no-files-found: error

  go:
    name: go
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Markdown links
        run: go test -count=1 ./internal/doccheck/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: ./scripts/place-web-dist.sh
      - run: go mod verify
      - run: go generate ./internal/db
      - run: git diff --exit-code
      - run: go tool sqlc vet
      - run: ./scripts/sqlc-diff.sh
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 -coverprofile=coverage.out ./...

  # govulncheck walks the whole module and is the slowest single step.
  # Its own job runs it beside the tests instead of after them.
  vuln:
    name: vuln
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go tool govulncheck ./...

  pdf:
    name: pdf
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Both tools are pinned by checksum in scripts/, so the cache key can
      # only change when a pin changes.
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.local/bin/typst
            ~/verapdf
          key: pdf-tools-${{ hashFiles('scripts/install-typst.sh', 'scripts/install-verapdf.sh', 'scripts/verapdf-auto-install.xml') }}
      - name: Install Poppler and Java
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils openjdk-21-jre-headless unzip
      - name: Install Typst
        run: |
          if [ ! -x "$HOME/.local/bin/typst" ]; then ./scripts/install-typst.sh "$HOME/.local/bin"; fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install veraPDF
        run: |
          if [ ! -x "$HOME/verapdf/verapdf" ]; then ./scripts/install-verapdf.sh "$HOME/verapdf"; fi
          echo "$HOME/verapdf" >> "$GITHUB_PATH"
      - name: Golden PDF
        run: go test -count=1 -timeout 15m ./internal/pdf/ ./internal/export/
        env:
          BELEGAPP_REQUIRE_PDF: "1"
          BELEGAPP_PDF_OUT: ${{ github.workspace }}/pdf-out
      - name: Validate PDF/A-2b
        run: |
          verapdf --flavour 2b --format xml -r pdf-out > pdf-out/verapdf.xml
          if grep -q 'isCompliant="false"' pdf-out/verapdf.xml; then
            echo "PDF/A-2b validation failed" >&2
            exit 1
          fi
          if ! grep -q 'isCompliant="true"' pdf-out/verapdf.xml; then
            echo "veraPDF report has no compliant result" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verapdf-report
          path: pdf-out/verapdf.xml
          if-no-files-found: warn

  docker:
    name: docker
    needs: [linux-amd64, linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-linux-amd64
          path: ${{ runner.temp }}/image/linux/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-linux-arm64
          path: ${{ runner.temp }}/image/linux/arm64
      - name: Image context
        run: |
          chmod +x "$RUNNER_TEMP/image"/linux/*/belegapp
          test -s "$RUNNER_TEMP/image/linux/amd64/belegapp"
          test -s "$RUNNER_TEMP/image/linux/arm64/belegapp"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: ${{ github.workspace }}/Dockerfile.goreleaser
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          tags: vc-belegapp:ci
          cache-from: type=gha,scope=belegapp
          cache-to: type=gha,scope=belegapp,mode=max
          # The container builder writes this exporter as a tar even without a
          # .tar suffix. Trivy only accepts a Docker archive or an OCI layout
          # directory, so the next step unpacks index.json before the scan.
          outputs: type=oci,dest=/tmp/belegapp-oci.tar
      - name: Unpack OCI layout
        run: |
          mkdir -p /tmp/belegapp-layout
          tar -xf /tmp/belegapp-oci.tar -C /tmp/belegapp-layout
          if [ ! -f /tmp/belegapp-layout/index.json ]; then
            echo "OCI layout is missing index.json" >&2
            find /tmp/belegapp-layout -maxdepth 3 -type f | head -50 >&2
            exit 1
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/belegapp-layout
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
      - name: Load linux/amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: ${{ github.workspace }}/Dockerfile.goreleaser
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: vc-belegapp:ci
          cache-from: type=gha,scope=belegapp
      - name: Smoke
        run: ./scripts/container-smoke.sh vc-belegapp:ci

  e2e:
    name: e2e
    needs: linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-linux-amd64
          path: dist/linux/amd64
      - name: Install Typst
        run: |
          ./scripts/install-typst.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test doubles
        run: |
          chmod +x dist/linux/amd64/belegapp
          CGO_ENABLED=0 go build -trimpath -o bin/fakellm ./e2e/fakellm
          CGO_ENABLED=0 go build -trimpath -o bin/mockoidc ./e2e/mockoidc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: e2e
        env:
          CI: "true"
          BELEGAPP_BIN: ${{ github.workspace }}/dist/linux/amd64/belegapp
          FAKE_LLM_BIN: ${{ github.workspace }}/bin/fakellm
          FAKE_OIDC_BIN: ${{ github.workspace }}/bin/mockoidc
          E2E_PASSWORD: belegapp-e2e
        run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: error

  # Same tool install and GoReleaser invocation as the tag release, minus
  # publish/sign/announce. --snapshot already implies those skips and also
  # skips validate, so the action asserts a clean tree itself. Snapshot
  # still builds per-platform images locally (--load); it does not push.
  # release.yml calls this workflow with dry-run: false.
  release-dry-run:
    name: release-dry-run
    # workflow_call is the tag release, which passes dry-run false and skips
    # this job. pull_request stays in the condition so a run still started
    # from the previous workflow file on main does not drop the snapshot.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/goreleaser
        with:
          args: release --snapshot --clean --skip=publish,sign,announce
          token: ${{ secrets.GITHUB_TOKEN }}

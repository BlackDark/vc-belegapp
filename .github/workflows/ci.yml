name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  # release-please opens its PR with GITHUB_TOKEN, which does not start
  # pull_request workflows. release-please.yml dispatches this workflow on
  # the release branch; the checks attach to that commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# web builds the bundle once. Each GoReleaser target is cross-compiled on
# its own runner (CGO_ENABLED=0, no QEMU) so e2e can start from linux/amd64
# without waiting for the other arches. docker only copies the linux
# binaries into distroless.

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec vite build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error

  # One arch per runner. Sharing a runner splits the cores, so four
  # parallel compiles finish no sooner than the slowest one and e2e waits.
  linux-amd64:
    name: linux-amd64
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: ./scripts/place-web-dist.sh
      - run: ./scripts/build-binaries.sh linux/amd64
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belegapp-linux-amd64
          path: dist/linux/amd64/belegapp
          if-no-files-found: error

  linux-arm64:
    name: linux-arm64
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: ./scripts/place-web-dist.sh
      - run: ./scripts/build-binaries.sh linux/arm64
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belegapp-linux-arm64
          path: dist/linux/arm64/belegapp
          if-no-files-found: error

  darwin:
    name: darwin
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: ./scripts/place-web-dist.sh
      - run: ./scripts/build-binaries.sh darwin/amd64 darwin/arm64
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: belegapp-darwin
          path: dist/darwin/
          if-no-files-found: error

  go:
    name: go
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: ./scripts/place-web-dist.sh
      - run: go mod verify
      - run: go generate ./internal/db
      - run: git diff --exit-code
      - run: go tool sqlc vet
      - run: ./scripts/sqlc-diff.sh
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool govulncheck ./...

  pdf:
    name: pdf
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Poppler and Java
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils openjdk-21-jre-headless unzip
      - name: Install Typst
        run: |
          ./scripts/install-typst.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install veraPDF
        run: |
          ./scripts/install-verapdf.sh "$HOME/verapdf"
          echo "$HOME/verapdf" >> "$GITHUB_PATH"
      - name: Golden PDF
        run: go test -count=1 -timeout 15m ./internal/pdf/ ./internal/export/
        env:
          BELEGAPP_REQUIRE_PDF: "1"
          BELEGAPP_PDF_OUT: ${{ github.workspace }}/pdf-out
      - name: Validate PDF/A-2b
        run: |
          verapdf --flavour 2b --format xml -r pdf-out > pdf-out/verapdf.xml
          if grep -q 'isCompliant="false"' pdf-out/verapdf.xml; then
            echo "PDF/A-2b validation failed" >&2
            exit 1
          fi
          if ! grep -q 'isCompliant="true"' pdf-out/verapdf.xml; then
            echo "veraPDF report has no compliant result" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verapdf-report
          path: pdf-out/verapdf.xml
          if-no-files-found: warn

  docker:
    name: docker
    needs: [linux-amd64, linux-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-linux-amd64
          path: ${{ runner.temp }}/image/linux/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-linux-arm64
          path: ${{ runner.temp }}/image/linux/arm64
      - name: Image context
        run: |
          chmod +x "$RUNNER_TEMP/image"/linux/*/belegapp
          test -s "$RUNNER_TEMP/image/linux/amd64/belegapp"
          test -s "$RUNNER_TEMP/image/linux/arm64/belegapp"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: ${{ github.workspace }}/Dockerfile.goreleaser
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          tags: vc-belegapp:ci
          cache-from: type=gha,scope=belegapp
          cache-to: type=gha,scope=belegapp,mode=max
          # The container builder writes this exporter as a tar even without a
          # .tar suffix. Trivy only accepts a Docker archive or an OCI layout
          # directory, so the next step unpacks index.json before the scan.
          outputs: type=oci,dest=/tmp/belegapp-oci.tar
      - name: Unpack OCI layout
        run: |
          mkdir -p /tmp/belegapp-layout
          tar -xf /tmp/belegapp-oci.tar -C /tmp/belegapp-layout
          if [ ! -f /tmp/belegapp-layout/index.json ]; then
            echo "OCI layout is missing index.json" >&2
            find /tmp/belegapp-layout -maxdepth 3 -type f | head -50 >&2
            exit 1
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/belegapp-layout
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
      - name: Load linux/amd64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/image
          file: ${{ github.workspace }}/Dockerfile.goreleaser
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: vc-belegapp:ci
          cache-from: type=gha,scope=belegapp
      - name: Smoke
        run: ./scripts/container-smoke.sh vc-belegapp:ci

  e2e:
    name: e2e
    needs: linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: belegapp-linux-amd64
          path: dist/linux/amd64
      - name: Install Typst
        run: |
          ./scripts/install-typst.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test doubles
        run: |
          chmod +x dist/linux/amd64/belegapp
          CGO_ENABLED=0 go build -trimpath -o bin/fakellm ./e2e/fakellm
          CGO_ENABLED=0 go build -trimpath -o bin/mockoidc ./e2e/mockoidc
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: e2e/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: e2e
        env:
          CI: "true"
          BELEGAPP_BIN: ${{ github.workspace }}/dist/linux/amd64/belegapp
          FAKE_LLM_BIN: ${{ github.workspace }}/bin/fakellm
          FAKE_OIDC_BIN: ${{ github.workspace }}/bin/mockoidc
          E2E_PASSWORD: belegapp-e2e
        run: pnpm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots
          if-no-files-found: error

  release-config:
    name: release-config
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: check
      - name: Release config changed
        id: paths
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -Eq '^(\.goreleaser\.yaml|Dockerfile\.goreleaser|\.github/workflows/release\.yml)$'; then
            echo "snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.paths.outputs.snapshot == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.paths.outputs.snapshot == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.paths.outputs.snapshot == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install syft
        if: steps.paths.outputs.snapshot == 'true'
        run: |
          version=1.54.1
          file="syft_${version}_linux_amd64.tar.gz"
          curl -fsSL -o "$file" "https://github.com/anchore/syft/releases/download/v${version}/${file}"
          curl -fsSL -o checksums.txt "https://github.com/anchore/syft/releases/download/v${version}/syft_${version}_checksums.txt"
          grep "$file" checksums.txt | sha256sum -c -
          tar -xzf "$file" syft
          sudo mv syft /usr/local/bin/syft
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        if: steps.paths.outputs.snapshot == 'true'
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --snapshot --clean --skip=docker,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

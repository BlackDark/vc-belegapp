name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# pdf (Typst golden file) starts with M3. e2e (Playwright) is optional and starts
# once authentication and receipt capture exist. M0 required checks are web, go, docker.

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec vite build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error

  go:
    name: go
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: Place frontend dist
        run: |
          if [ -f web/dist/index.html ]; then
            exit 0
          fi
          if [ -f web/dist/dist/index.html ]; then
            mv web/dist/dist/* web/dist/
            rmdir web/dist/dist
            exit 0
          fi
          if [ -f web/dist/web/dist/index.html ]; then
            mkdir -p web/dist-fixed
            mv web/dist/web/dist/* web/dist-fixed/
            rm -rf web/dist
            mv web/dist-fixed web/dist
            exit 0
          fi
          echo "unexpected web-dist layout" >&2
          find web -name index.html -o -name 'index-*.js' | head
          exit 1
      - run: go mod verify
      - run: go generate ./internal/db
      - run: git diff --exit-code
      - run: go tool sqlc vet
      - run: ./scripts/sqlc-diff.sh
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: --timeout=5m
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - run: go tool govulncheck ./...

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          tags: ghcr.io/blackdark/vc-belegapp:ci
          # The container builder writes this exporter as a tar even without a
          # .tar suffix. Trivy only accepts a Docker archive or an OCI layout
          # directory, so the next step unpacks index.json before the scan.
          outputs: type=oci,dest=/tmp/belegapp-oci.tar
      - name: Unpack OCI layout
        run: |
          mkdir -p /tmp/belegapp-layout
          tar -xf /tmp/belegapp-oci.tar -C /tmp/belegapp-layout
          if [ ! -f /tmp/belegapp-layout/index.json ]; then
            echo "OCI layout is missing index.json" >&2
            find /tmp/belegapp-layout -maxdepth 3 -type f | head -50 >&2
            exit 1
          fi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/belegapp-layout
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln

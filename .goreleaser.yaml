version: 2

project_name: vc-belegapp

before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build
    - go generate ./...

builds:
  - id: belegapp
    binary: belegapp
    main: ./cmd/belegapp
    env:
      - CGO_ENABLED=0
    # linux only. There used to be a darwin target for macOS tarballs; the
    # release publishes no binaries, so nothing consumes one.
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

# No archives, checksums, SBOM documents or blob signatures: the container
# image is the only thing this project publishes, and an image is addressed and
# verified by digest. The image carries its own signature (docker_signs below)
# and its SBOM is a buildx attestation (dockers_v2.sbom, default true), which is
# why Syft is no longer installed for the release.
dockers_v2:
  - ids:
      - belegapp
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/blackdark/vc-belegapp
    tags:
      - "{{.Version}}"
      - "{{.Major}}.{{.Minor}}"
      - "{{.Major}}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/BlackDark/vc-belegapp
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.title: vc-belegapp
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"

docker_signs:
  # Sign the index digest. Cosign v3 warns, and may refuse, a tag-only ref.
  - cmd: cosign
    artifacts: all
    output: true
    args:
      - sign
      - --yes
      - ${artifact}@${digest}

changelog:
  disable: true

snapshot:
  version_template: "{{ .Version }}-snapshot"

release:
  # release-please creates the GitHub release before this runs. append keeps
  # that body and adds the footer. keep-existing would drop the footer.
  # GoReleaser updates the release in place; it does not fail with already_exists.
  # Nothing is uploaded: the release is release-please's notes plus the footer,
  # which names the image. The image itself goes to ghcr.io, not to the release.
  mode: append
  footer: |

    Container image: `ghcr.io/blackdark/vc-belegapp:{{ .Version }}`

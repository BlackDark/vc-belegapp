version: 2

project_name: vc-belegapp

before:
  hooks:
    - pnpm -C web install --frozen-lockfile
    - pnpm -C web build
    - go generate ./...

builds:
  - id: belegapp
    binary: belegapp
    main: ./cmd/belegapp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: belegapp
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - deploy/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Cosign v3 (the release installer pins v3.0.6) rejects
# --output-signature / --output-certificate. Keyless signing uses the
# Actions OIDC token; there is no cosign.key.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

# Host syft (v1.54.1, installed outside the checkout) catalogs each archive.
# Defaults: cmd syft, args "$artifact --output spdx-json=$document --enrich all".
# The image SBOM is separate: dockers_v2 sbom defaults to true, so the publish
# build passes --attest=type=sbom. Snapshot builds do not.
sboms:
  - artifacts: archive

dockers_v2:
  - ids:
      - belegapp
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/blackdark/vc-belegapp
    tags:
      - "{{.Version}}"
      - "{{.Major}}.{{.Minor}}"
      - "{{.Major}}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/BlackDark/vc-belegapp
      org.opencontainers.image.licenses: MIT
      org.opencontainers.image.title: vc-belegapp
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"

docker_signs:
  # Sign the index digest. Cosign v3 warns, and may refuse, a tag-only ref.
  - cmd: cosign
    artifacts: all
    output: true
    args:
      - sign
      - --yes
      - ${artifact}@${digest}

changelog:
  disable: true

snapshot:
  version_template: "{{ .Version }}-snapshot"

release:
  # release-please creates the GitHub release before this runs. append keeps
  # that body and adds the footer. keep-existing would drop the footer.
  # GoReleaser updates the release in place; it does not fail with already_exists.
  mode: append
  # A re-run of the same tag replaces uploaded assets instead of 422 already_exists.
  replace_existing_artifacts: true
  footer: |

    Container image: `ghcr.io/blackdark/vc-belegapp:{{ .Version }}`

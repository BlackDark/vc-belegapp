apiVersion: v1
kind: Secret
metadata:
  name: belegapp
type: Opaque
stringData:
  # There is no password entry. The instance password is an argon2id hash in
  # the database on the data volume:
  #   kubectl exec deploy/belegapp -- /belegapp set-password
  # The process refuses to start until a password, OIDC, or trusted-header
  # authentication exists, so run that once after the first rollout (or set the
  # OIDC variables, or the BELEGAPP_AUTH_HEADER_* ones in the ConfigMap,
  # instead).
  #
  # App password of the dedicated IMAP account. Create it with
  # `kubectl create secret generic belegapp-imap --from-literal=KEY=...` and
  # mount it, or uncomment the line below and apply from a trusted machine.
  # BELEGAPP_MAIL_PASSWORD: "app-password"
  # Access token of the ntfy (or other) receiver, sent as Authorization: Bearer.
  # Only used when BELEGAPP_NOTIFY_WEBHOOK_URL is set in the config map.
  # BELEGAPP_NOTIFY_WEBHOOK_TOKEN: "tk_..."

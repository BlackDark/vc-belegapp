apiVersion: batch/v1
kind: CronJob
metadata:
  name: belegapp-backup
spec:
  schedule: "15 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/blackdark/vc-belegapp:1
              imagePullPolicy: IfNotPresent
              command: ["/belegapp", "backup", "--out", "/data/backups/belegapp.zip"]
              envFrom:
                - configMapRef:
                    name: belegapp
                - secretRef:
                    name: belegapp
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: belegapp-data
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi

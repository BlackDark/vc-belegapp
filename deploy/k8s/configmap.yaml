apiVersion: v1
kind: ConfigMap
metadata:
  name: belegapp
data:
  BELEGAPP_BASE_URL: https://belege.example.de
  BELEGAPP_TZ: Europe/Berlin
  BELEGAPP_TRUSTED_PROXIES: 10.0.0.0/8
  BELEGAPP_STORAGE_BACKEND: fs
  BELEGAPP_COOKIE_SECURE: "true"
  # Receipt intake by e-mail. Uncomment together with BELEGAPP_MAIL_PASSWORD in
  # the belegapp secret; the password is required while the intake is on and the
  # process refuses to start without it. Without BELEGAPP_MAIL_ENABLED no ticker
  # runs and no mail job is created. Use a dedicated account with an app password.
  # BELEGAPP_MAIL_ENABLED: "true"
  # BELEGAPP_MAIL_HOST: imap.example.de
  # BELEGAPP_MAIL_USERNAME: belege@example.de
  # BELEGAPP_MAIL_INBOX: Belege
  # BELEGAPP_MAIL_DONE_FOLDER: Belege/erledigt
  # BELEGAPP_MAIL_ALLOWED_SENDERS: kasse@example.de
  # BELEGAPP_MAIL_INTERVAL: 5m
  # BELEGAPP_MAIL_MAX_MESSAGES_PER_POLL: "50"
  # BELEGAPP_MAIL_MAX_ATTACHMENTS_PER_MESSAGE: "10"
  # Review notification. Without BELEGAPP_NOTIFY_WEBHOOK_URL no notify job is
  # created at all, so this stays commented out until an operator wants it.
  # BELEGAPP_NOTIFY_WEBHOOK_URL: https://ntfy.sh/belegapp-pruefen
  # BELEGAPP_NOTIFY_WEBHOOK_TOKEN_FILE: /run/secrets/notify_token
  # BELEGAPP_NOTIFY_TIMEOUT: 10s
  # Receipt intake from a watched folder (scanner, download directory, phone
  # sync client). Without this path no ticker runs and no watch job is
  # created. The volume has to be writable: files are moved into
  # <folder>/.processed/ after ingest and never deleted.
  # BELEGAPP_WATCH_FOLDER: /watch
  # BELEGAPP_WATCH_INTERVAL: 30s

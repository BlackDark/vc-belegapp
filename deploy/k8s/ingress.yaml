apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: belegapp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 4g
spec:
  ingressClassName: nginx
  tls:
    - hosts: [belege.example.de]
      secretName: belegapp-tls
  rules:
    - host: belege.example.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: belegapp
                port:
                  number: 8080

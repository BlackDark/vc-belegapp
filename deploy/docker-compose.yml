# Copy deploy/.env.example to deploy/.env and fill it in.
# `docker compose` refuses to start while a ${VAR:?} value is empty.
# The process itself accepts either a password hash or OIDC. This example sets both, plus the LLM key.
services:
  belegapp:
    image: ghcr.io/blackdark/vc-belegapp:1
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    # Seccomp stays the engine default, the same policy as Kubernetes RuntimeDefault.
    # Do not set seccomp:unconfined.
    security_opt:
      - no-new-privileges:true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    mem_limit: 512m
    mem_reservation: 64m
    cpus: 1
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./data:/data"] # chown -R 65532:65532 ./data beforehand
    # Receipt intake from a watched folder, off unless BELEGAPP_WATCH_FOLDER is
    # set. Uncomment both lines below and create the directory with the same
    # ownership as ./data: the poll MOVES each file into ./watch/.processed/
    # after storing it, so a read-only mount makes every move fail.
    #   mkdir -p watch && chown 65532:65532 watch
    # volumes:
    #   - "./watch:/watch"
    environment:
      BELEGAPP_BASE_URL: ${BELEGAPP_BASE_URL:?set BELEGAPP_BASE_URL}
      BELEGAPP_TRUSTED_PROXIES: ${BELEGAPP_TRUSTED_PROXIES:-172.16.0.0/12}
      BELEGAPP_OIDC_ISSUER_URL: ${BELEGAPP_OIDC_ISSUER_URL:?set BELEGAPP_OIDC_ISSUER_URL}
      BELEGAPP_OIDC_CLIENT_ID: ${BELEGAPP_OIDC_CLIENT_ID:?set BELEGAPP_OIDC_CLIENT_ID}
      BELEGAPP_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_secret
      # Optional when BELEGAPP_OIDC_ALLOWED_SUBJECTS is used instead.
      # "*" admits every account with a verified email at the issuer.
      BELEGAPP_OIDC_ALLOWED_EMAILS: ${BELEGAPP_OIDC_ALLOWED_EMAILS:-}
      BELEGAPP_AUTH_PASSWORD_HASH_FILE: /run/secrets/pw_hash
      BELEGAPP_LLM_API_KEY_FILE: /run/secrets/openai_key
      # Receipt intake by e-mail, off unless BELEGAPP_MAIL_ENABLED is true.
      # Create the `imap_password` secret and uncomment the three lines below to
      # turn it on; a dedicated account with an app password is the right setup.
      # BELEGAPP_MAIL_ENABLED: "true"
      # BELEGAPP_MAIL_HOST: imap.example.de
      # BELEGAPP_MAIL_USERNAME: belege@example.de
      # BELEGAPP_MAIL_PASSWORD_FILE: /run/secrets/imap_password
      # BELEGAPP_MAIL_INBOX: Belege
      # BELEGAPP_MAIL_DONE_FOLDER: Belege/erledigt
      # BELEGAPP_MAIL_ALLOWED_SENDERS: kasse@example.de
      # BELEGAPP_MAIL_INTERVAL: 5m
      # Review notification, off unless BELEGAPP_NOTIFY_WEBHOOK_URL is set.
      # Every stored image (phone upload, mail, watched folder) posts one
      # bild.pruefen document; the payload carries no image data and no
      # credential. Create the `notify_token` secret to send a bearer token.
      # BELEGAPP_NOTIFY_WEBHOOK_URL: https://ntfy.sh/belegapp-pruefen
      # BELEGAPP_NOTIFY_WEBHOOK_TOKEN_FILE: /run/secrets/notify_token
      # BELEGAPP_NOTIFY_TIMEOUT: 10s
      # Receipt intake from a watched folder (scanner, download directory,
      # phone sync client). Off unless BELEGAPP_WATCH_FOLDER is set. The
      # folder must be writable: files are moved into .processed/ after
      # ingest and never deleted.
      # BELEGAPP_WATCH_FOLDER: /watch
      # BELEGAPP_WATCH_INTERVAL: 30s
    secrets: [oidc_secret, pw_hash, openai_key, imap_password]
    healthcheck:
      test: ["CMD", "/belegapp", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
secrets:
  oidc_secret:
    file: ${OIDC_SECRET_FILE:?path to the OIDC client secret}
  pw_hash:
    file: ${PASSWORD_HASH_FILE:?path to the argon2id password hash}
  openai_key:
    file: ${LLM_API_KEY_FILE:?path to the LLM API key}
  # Only read when the IMAP intake is enabled (BELEGAPP_MAIL_ENABLED). The
  # path points at the app password of a dedicated mail account.
  imap_password:
    file: ${IMAP_PASSWORD_FILE:-/dev/null}
